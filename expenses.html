{% extends "base.html" %}{% block content %}<h1>খরচ</h1><form method="post" class="form"><input name="category" placeholder="খরচের ধরন" required><input name="amount" type="number" step="0.01" placeholder="Amount" required><input name="expense_date" type="date"><input name="note" placeholder="Note"><button>Save Expense</button></form><table><tr><th>Category</th><th>Amount</th><th>Date</th><th>Note</th></tr>{% for r in rows %}<tr><td>{{r.category}}</td><td>{{r.amount}}</td><td>{{r.expense_date}}</td><td>{{r.note}}</td></tr>{% endfor %}</table>{% endblock %}
