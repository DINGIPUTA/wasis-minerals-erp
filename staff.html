{% extends "base.html" %}{% block content %}<h1>Staff / Users</h1><form method="post" class="form"><input name="name" placeholder="নাম" required><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><select name="role"><option>staff</option><option>manager</option><option>accounts</option><option>store</option><option>sales</option><option>admin</option></select><button>Create User</button></form><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Active</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.username}}</td><td>{{r.role}}</td><td>{{r.active}}</td></tr>{% endfor %}</table>{% endblock %}
