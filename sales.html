{% extends "base.html" %}{% block content %}<h1>বিক্রি / ডেলিভারি</h1><form method="post" class="form"><input name="invoice" placeholder="Invoice No" required><select name="customer_id" required>{% for c in customers %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="product" placeholder="পাথর" required><input name="quantity" type="number" step="0.01" placeholder="টন" required><input name="price" type="number" step="0.01" placeholder="প্রতি টন দাম" required><input name="truck_no" placeholder="গাড়ি নম্বর"><input name="delivery_date" type="date"><input name="paid" type="number" step="0.01" placeholder="আজকে পাওয়া টাকা"><button>Save Delivery</button></form><table><tr><th>Invoice</th><th>Customer</th><th>Product</th><th>Qty</th><th>Rate</th><th>Truck</th><th>Date</th><th>Invoice</th><th>Delivery Cost</th></tr>{% for r in rows %}<tr><td>{{r.invoice}}</td><td>{{r.customer}}</td><td>{{r.product}}</td><td>{{r.quantity}}</td><td>{{r.price}}</td><td>{{r.truck_no}}</td><td>{{r.delivery_date}}</td><td><a href="/invoice/{{r.id}}" target="_blank">Print</a></td>
<td><details><summary>Add</summary><form method="post" action="/delivery-cost/{{r.id}}" class="mini">
<input name="truck_no" placeholder="Truck"><input name="driver" placeholder="Driver">
<input name="freight" type="number" step="0.01" placeholder="Freight"><input name="loading_cost" type="number" step="0.01" placeholder="Loading">
<input name="unloading_cost" type="number" step="0.01" placeholder="Unloading"><input name="delivery_date" type="date">
<button>Save</button></form></details></td></tr>{% endfor %}</table>{% endblock %}
