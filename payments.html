{% extends "base.html" %}{% block content %}<h1>পেমেন্ট</h1><form method="post" class="form"><select name="customer_id">{% for c in customers %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="amount" type="number" step="0.01" placeholder="Amount" required><input name="payment_date" type="date"><input name="method" placeholder="Cash/Bank/MFS"><input name="note" placeholder="Note"><button>Save Payment</button></form><table><tr><th>Customer</th><th>Amount</th><th>Date</th><th>Method</th><th>Note</th></tr>{% for r in rows %}<tr><td>{{r.customer}}</td><td>{{r.amount}}</td><td>{{r.payment_date}}</td><td>{{r.method}}</td><td>{{r.note}}</td></tr>{% endfor %}</table>{% endblock %}
