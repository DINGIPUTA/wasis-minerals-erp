{% extends "base.html" %}{% block content %}<h1>কাস্টমার</h1><form method="post" class="form"><input name="name" placeholder="কোম্পানির নাম" required><input name="phone" placeholder="মোবাইল"><input name="address" placeholder="ঠিকানা"><input name="opening_due" type="number" step="0.01" placeholder="Opening Due"><button>Save</button></form><table><tr><th>Name</th><th>Phone</th><th>Address</th><th>Opening Due</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.phone}}</td><td>{{r.address}}</td><td>{{r.opening_due}}</td></tr>{% endfor %}</table>{% endblock %}
