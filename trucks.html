{% extends "base.html" %}{% block content %}<h1>গাড়ি / Truck</h1><form method="post" class="form"><input name="truck_no" placeholder="গাড়ি নম্বর" required><input name="driver" placeholder="Driver"><input name="phone" placeholder="Phone"><input name="rent" type="number" step="0.01" placeholder="ভাড়া"><button>Save</button></form><table><tr><th>Truck</th><th>Driver</th><th>Phone</th><th>Rent</th></tr>{% for r in rows %}<tr><td>{{r.truck_no}}</td><td>{{r.driver}}</td><td>{{r.phone}}</td><td>{{r.rent}}</td></tr>{% endfor %}</table>{% endblock %}
