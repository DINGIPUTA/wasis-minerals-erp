{% extends "base.html" %}{% block content %}<h1>স্টক</h1><form method="post" class="form"><input name="product" placeholder="পাথরের ধরন/সাইজ" required><input name="quantity" type="number" step="0.01" placeholder="পরিমাণ টন" required><input name="unit_cost" type="number" step="0.01" placeholder="Cost/Ton"><input name="location" placeholder="গুদাম/সাইট"><button>Stock In</button></form><table><tr><th>Product</th><th>Qty</th><th>Unit Cost</th><th>Location</th></tr>{% for r in rows %}<tr><td>{{r.product}}</td><td>{{r.quantity}}</td><td>{{r.unit_cost}}</td><td>{{r.location}}</td></tr>{% endfor %}</table>{% endblock %}
